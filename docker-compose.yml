# BCIP development stack.
#
# Docker is mandatory for this project (Implementation Plan, Phase 0): WeasyPrint
# depends on Pango/Cairo/GDK-Pixbuf, which are unreliable to install by hand on
# Windows and macOS. Everything below runs without any host-level system
# packages beyond Docker itself.
#
#   docker compose up --build
#
# The `worker` service runs the django-q2 cluster. It is deliberately configured
# for single-worker concurrency (see Q_CLUSTER in settings.py) so that all
# on-chain writes serialise through one process and cannot collide on nonce.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bcip}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bcip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment: []
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py qcluster
    volumes:
      - ./backend:/app
      - media_data:/app/media
    env_file:
      - path: ./backend/.env
        required: false
    environment: []
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
  media_data:
