services:
  # ─── 1. Django REST API Web Service + Worker (Combined) ──────────────────────
  - type: web
    name: bcip-backend
    plan: free
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Use the combined startup script
    dockerCommand: bash ./start.sh
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
      # You will need to update these once Vercel gives you your URL
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_CONTRACT_ADDRESS
        sync: false
      - key: BLOCKCHAIN_ISSUER_PRIVATE_KEY
        sync: false
      # Render blocks outbound SMTP ports (25/465/587), so mail goes out over
      # Resend's HTTPS API instead of smtp.resend.com.
      - key: EMAIL_BACKEND
        value: "notifications.email_backends.ResendAPIBackend"
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
