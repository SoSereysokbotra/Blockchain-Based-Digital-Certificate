{% comment %}
One-time-code email, shared by verification and password reset.

Written to 2005-era HTML on purpose. Mail clients are not browsers: Outlook
renders through Word, Gmail strips <style> in some contexts and rewrites the
rest, and none of them support CSS custom properties. So the design tokens
from frontend/src/styles/tokens.css are inlined here as literal hex, tables
carry the layout instead of flex, and every colour is stated explicitly —
a transparent background would otherwise inherit whatever the client paints.

Context: heading, greeting_name, intro, code, ttl_minutes, disclaimer,
         preheader, frontend_url.
{% endcomment %}
<div style="background-color:#F5F6F3;margin:0;padding:0;width:100%;">

  <!-- Inbox preview line. Kept clear of the code itself: this text renders on
       lock screens and in notification popups, where the code should not. -->
  <div style="display:none;font-size:1px;color:#F5F6F3;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">
    {{ preheader }}
  </div>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
         style="background-color:#F5F6F3;border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
               style="max-width:520px;border-collapse:collapse;">

          <!-- ── Wordmark ────────────────────────────────────────────── -->
          <tr>
            <td style="padding:0 0 20px 0;text-align:center;">
              <span style="font-family:'Iowan Old Style',Palatino,'Book Antiqua',Georgia,serif;
                           font-size:20px;font-weight:600;letter-spacing:0.14em;color:#0B6B5F;">
                BCIP
              </span>
            </td>
          </tr>

          <!-- ── Card ────────────────────────────────────────────────── -->
          <tr>
            <td style="background-color:#FFFFFF;border:1px solid #DCE0DA;border-radius:12px;padding:36px 32px;">

              <h1 style="margin:0 0 20px 0;font-family:'Iowan Old Style',Palatino,'Book Antiqua',Georgia,serif;
                         font-size:23px;font-weight:600;line-height:1.3;color:#161B19;">
                {{ heading }}
              </h1>

              <p style="margin:0 0 8px 0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
                        font-size:15px;line-height:1.6;color:#354039;">
                Hello {{ greeting_name }},
              </p>

              <p style="margin:0 0 24px 0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
                        font-size:15px;line-height:1.6;color:#354039;">
                {{ intro }}
              </p>

              <!-- ── The code ──────────────────────────────────────────
                   Its own bordered panel so it survives the glance test:
                   this is the one thing the reader came for. -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                     style="border-collapse:collapse;margin:0 0 24px 0;">
                <tr>
                  <td align="center"
                      style="background-color:#E3EFEC;border:1px solid #0B6B5F;border-radius:10px;padding:22px 16px;">
                    <div style="font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
                                font-size:11px;font-weight:600;letter-spacing:0.12em;
                                text-transform:uppercase;color:#0B6B5F;padding-bottom:10px;">
                      Your code
                    </div>
                    <div style="font-family:'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace;
                                font-size:34px;font-weight:700;letter-spacing:0.30em;
                                line-height:1.1;color:#0B6B5F;
                                /* letter-spacing pads the right edge; nudge it back */
                                text-indent:0.30em;">
                      {{ code }}
                    </div>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 24px 0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
                        font-size:14px;line-height:1.6;color:#5B6662;">
                It expires in {{ ttl_minutes }} minutes and can be used once.
              </p>

              <!-- ── Disclaimer ───────────────────────────────────────── -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                     style="border-collapse:collapse;">
                <tr>
                  <td style="background-color:#F5EEDF;border-left:3px solid #8A6D3B;border-radius:0 6px 6px 0;padding:12px 14px;">
                    <p style="margin:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
                              font-size:13px;line-height:1.6;color:#5B4A28;">
                      {{ disclaimer }}
                    </p>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- ── Footer ──────────────────────────────────────────────── -->
          <tr>
            <td style="padding:20px 8px 0 8px;text-align:center;">
              <p style="margin:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
                        font-size:12px;line-height:1.6;color:#7C8783;">
                Blockchain-Based Certificate Issuing Platform
              </p>
              <p style="margin:6px 0 0 0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
                        font-size:12px;line-height:1.6;color:#7C8783;">
                This is an automated message — please do not reply.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</div>
