[pytest]
DJANGO_SETTINGS_MODULE = bcip_backend.settings
python_files = tests.py test_*.py *_tests.py
addopts =
    --strict-markers
    --disable-warnings
    -ra
    ; web3 6.x ships a `pytest_ethereum` plugin that fails to import against the
    ; eth-typing it pulls in. It is unrelated to anything BCIP tests, so it is
    ; disabled rather than worked around.
    -p no:pytest_ethereum
testpaths = accounts certificates blockchain notifications
markers =
    integration: end-to-end flows spanning several apps (Phase 9)
